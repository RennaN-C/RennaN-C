<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title description">
  <title id="title">Rennan Cardoso — Software Developer</title>
  <desc id="description">Banner de desenvolvedor em grafite, branco e detalhes discretos em azul e ciano.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset=".62" stop-color="#101820"/>
      <stop offset="1" stop-color="#0B1623"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58A6FF" stop-opacity=".03"/>
      <stop offset=".62" stop-color="#58A6FF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity=".04"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#58A6FF" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#67E8F9" fill-opacity=".24"/>
    </pattern>
    <clipPath id="frame"><rect width="1600" height="460" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="460" fill="url(#backdrop)"/>
    <rect x="945" y="0" width="655" height="460" fill="url(#grid)" opacity=".76"/>
    <path d="M1220 -80L1508 -80L1042 500H754Z" fill="url(#beam)"/>
    <path d="M1500 -70L1605 -70L1185 470H1090Z" fill="#58A6FF" fill-opacity=".035"/>
    <path d="M990 460L1370 0H1512L1130 460Z" fill="#0D1117" fill-opacity=".42"/>

    <!-- Margem técnica e etiqueta -->
    <rect x="74" y="70" width="7" height="34" rx="3.5" fill="url(#accent)"/>
    <text x="104" y="95" fill="#79C0FF" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="4">// DEVELOPER PROFILE</text>
    <line x1="75" y1="122" x2="560" y2="122" stroke="#58A6FF" stroke-opacity=".35" stroke-width="2"/>
    <line x1="75" y1="122" x2="185" y2="122" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>

    <!-- Conteúdo principal -->
    <text x="72" y="229" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-1">RENNAN CARDOSO</text>
    <text x="77" y="292" fill="#F5F7FA" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="500" letter-spacing="9">SOFTWARE DEVELOPER</text>
    <rect x="76" y="318" width="4" height="38" rx="2" fill="#58A6FF"/>
    <text x="102" y="344" fill="#C9D1D9" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="2">BACK-END  /  APIs  /  DATABASES  /  ARCHITECTURE</text>

    <!-- Área abstrata, propositalmente sutil para não competir com o texto -->
    <path d="M1112 0L1242 128H1330L1460 0" fill="none" stroke="#58A6FF" stroke-opacity=".34" stroke-width="2"/>
    <path d="M1000 460L1155 295H1280L1444 130H1600" fill="none" stroke="#58A6FF" stroke-opacity=".65" stroke-width="2"/>
    <path d="M1160 460L1322 299H1453L1560 192H1600" fill="none" stroke="#67E8F9" stroke-opacity=".42" stroke-width="2"/>
    <path d="M940 385H1093L1164 314H1230" fill="none" stroke="#58A6FF" stroke-opacity=".22" stroke-width="2"/>
    <path d="M1260 83H1386L1456 13" fill="none" stroke="#67E8F9" stroke-opacity=".32" stroke-width="2"/>
    <path d="M1465 400H1600" fill="none" stroke="#58A6FF" stroke-opacity=".24" stroke-width="2"/>

    <rect x="1240" y="76" width="255" height="210" fill="url(#dots)" opacity=".57"/>
    <rect x="1060" y="347" width="192" height="76" fill="url(#dots)" opacity=".45"/>
    <circle cx="1155" cy="295" r="5" fill="#67E8F9" fill-opacity=".75"/>
    <circle cx="1453" cy="299" r="4" fill="#58A6FF" fill-opacity=".8"/>
    <circle cx="1242" cy="128" r="4" fill="#58A6FF" fill-opacity=".7"/>
    <g fill="#58A6FF" fill-opacity=".5">
      <rect x="1300" y="55" width="10" height="10" rx="2"/>
      <rect x="1318" y="55" width="10" height="10" rx="2" opacity=".5"/>
      <rect x="1336" y="55" width="10" height="10" rx="2" opacity=".3"/>
      <rect x="1354" y="55" width="10" height="10" rx="2" opacity=".2"/>
    </g>

    <!-- Moldura, rodapé e microdetalhes -->
    <line x1="75" y1="402" x2="555" y2="402" stroke="#58A6FF" stroke-opacity=".12" stroke-width="1"/>
    <rect x="75" y="419" width="145" height="3" rx="1.5" fill="url(#accent)"/>
    <rect x="226" y="419" width="350" height="3" rx="1.5" fill="#58A6FF" fill-opacity=".11"/>
    <text x="75" y="446" fill="#8B9CAD" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="2">BUILDING RELIABLE SOFTWARE</text>
  </g>
</svg>