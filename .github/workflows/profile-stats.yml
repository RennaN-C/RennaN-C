name: Atualizar estatisticas do perfil

on:
  schedule:
    # A cada 6 horas (UTC); horarios deslocados para evitar o pico.
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-stats.yml"
      - "scripts/style_profile_cards.py"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do perfil
        uses: actions/checkout@v4

      - name: Verificar se o Secret foi configurado
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$PROFILE_STATS_TOKEN" ]; then
            echo "::error::Secret PROFILE_STATS_TOKEN ausente. Configure em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Gerar GitHub Stats (com repositorios privados)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&include_all_commits=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR&show_icons=true&show=reviews,prs_merged,prs_merged_percentage,prs_authored,prs_reviewed,issues_authored&number_format=long&locale=en&hide_border=true&card_width=495&bg_color=101820&title_color=FFFFFF&text_color=F5F7FA&icon_color=58A6FF&ring_color=58A6FF&disable_animations=false"
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      - name: Gerar GitHub Streak (com contribuicoes privadas)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: "user=${{ github.repository_owner }}&theme=dark&background=101820&stroke=263445&ring=58A6FF&fire=67E8F9&currStreakNum=FFFFFF&sideNums=FFFFFF&currStreakLabel=67E8F9&sideLabels=E6EDF3&dates=C9D1D9&hide_border=true&locale=pt_BR&timezone=America%2FSao_Paulo&short_numbers=false&disable_animations=false"
          path: profile/streak.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Aplicar animacoes sutis e acessiveis
        run: python3 scripts/style_profile_cards.py

      - name: Verificar os SVGs produzidos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          for name in ('stats', 'streak'):
              file = Path(f'profile/{name}.svg')
              if not file.is_file() or file.stat().st_size == 0:
                  raise SystemExit(f'SVG ausente ou vazio: {file}')
              svg = ElementTree.parse(file).getroot()
              if svg.tag.split('}')[-1] != 'svg':
                  raise SystemExit(f'Arquivo invalido: {file}')
              print(f'OK: {file} ({file.stat().st_size} bytes)')
          PY

      - name: Publicar cards somente se houver mudancas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/streak.svg
          if git diff --cached --quiet; then
            echo "Cards sem alteracoes."
            exit 0
          fi
          git commit -m "chore: refresh GitHub profile cards [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
