      stroke-dashoffset: 251.32741228718345;
      animation: rankAnimation 2.1s ease-in-out 4.05s forwards, rankBreath 3.8s ease-in-out 6.35s infinite;
    }
    
    @keyframes rankAnimation {
      from {
